name: Release

# Every push to main builds a signed APK and publishes it as a new GitHub release.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 0.1.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Fail instead of publishing an unsigned APK: installs signed with another key can't be updated.
      - name: Set up signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.WFO_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.WFO_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.WFO_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.WFO_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Missing signing secrets (WFO_KEYSTORE_BASE64, WFO_STORE_PASSWORD, WFO_KEY_ALIAS, WFO_KEY_PASSWORD)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          mkdir -p ~/.gradle
          {
            echo "WFO_STORE_FILE=$RUNNER_TEMP/release.keystore"
            echo "WFO_STORE_PASSWORD=$STORE_PASSWORD"
            echo "WFO_KEY_ALIAS=$KEY_ALIAS"
            echo "WFO_KEY_PASSWORD=$KEY_PASSWORD"
          } >> ~/.gradle/gradle.properties

      - name: Test
        run: ./gradlew :app:testDebugUnitTest

      - name: Build release APK
        # v0.1.0 was published by hand with versionCode 1, so CI codes start above it.
        run: ./gradlew :app:assembleRelease -PWFO_VERSION_CODE=$((VERSION_CODE + 1)) -PWFO_VERSION_NAME=$VERSION_NAME

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk widgets-for-obsidian.apk
          gh release create "v$VERSION_NAME" widgets-for-obsidian.apk \
            --target "$GITHUB_SHA" \
            --title "v$VERSION_NAME" \
            --generate-notes \
            --latest
